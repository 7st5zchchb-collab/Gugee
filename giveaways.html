<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee — Giveaways</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/community.css"></head>
<body><div class="background-glow"></div><header class="site-header"><a class="brand" href="./"><img class="brand-logo" src="images/gugee-logo-3c.webp" alt="Gugee logo"><span>Gugee</span></a><button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav class="nav" id="siteNav"><a href="markets.html">Markets</a><a href="account.html#buyPanel">Trading</a><a href="tournaments.html">Tournaments</a><a class="active" href="giveaways.html">Giveaways</a><a href="referrals.html">Referrals</a></nav><a class="login-button" href="account.html">Account</a></header>
<main class="community-page"><section class="hero"><span class="eyebrow">COMMUNITY REWARDS</span><h1>Gugee Giveaways</h1><p>Free community events with transparent rules, entry status and winner history.</p></section><div class="giveaway-grid" id="giveawayGrid"><div class="loading-card">Loading giveaways…</div></div><section class="panel" id="giveawayDetail" hidden><div class="panel-head"><div><span class="eyebrow">GIVEAWAY DASHBOARD</span><h2 id="detailName">Giveaway</h2><p id="detailDescription" class="muted"></p></div></div><div class="event-stats" id="detailStats"></div><div id="winnerHistory" class="table-wrap" style="margin-top:12px"></div></section></main>
<script src="js/auth.js"></script><script>
async function load(){try{const r=await gugeeAuth.api("/api/giveaways");document.querySelector("#giveawayGrid").innerHTML=r.giveaways.map(g=>'<article class="event-card giveaway-card"><div class="event-top"><span class="pill">'+g.status+'</span><span>'+new Date(g.ends_at).toLocaleString()+'</span></div><h3>'+g.name+'</h3><p>'+g.description+'</p><div class="event-stats"><div><small>PRIZE</small><b>$'+Number(g.prize_usdt).toFixed(2)+' USDT</b></div><div><small>ENTRIES</small><b>'+g.entry_count+'</b></div></div><button class="primary-btn enter-btn" data-id="'+g.id+'">'+(g.joined?"Entered":"Enter giveaway")+'</button><button class="secondary-action detail-btn" data-id="'+g.id+'">View details</button></article>').join("")||'<div class="empty-card">No active giveaways.</div>';document.querySelectorAll(".enter-btn").forEach(b=>b.onclick=()=>enter(b.dataset.id));document.querySelectorAll(".detail-btn").forEach(b=>b.onclick=()=>detail(b.dataset.id))}catch(e){document.querySelector("#giveawayGrid").innerHTML='<div class="empty-card">'+e.message+"</div>"}}
async function detail(id){try{const r=await gugeeAuth.api('/api/giveaways');const g=(r.giveaways||[]).find(x=>String(x.id)===String(id));if(!g)return;document.querySelector('#giveawayDetail').hidden=false;document.querySelector('#detailName').textContent=g.name;document.querySelector('#detailDescription').textContent=g.description||'';document.querySelector('#detailStats').innerHTML='<div><small>STATUS</small><b>'+g.status+'</b></div><div><small>PRIZE</small><b>'+Number(g.prize_usdt).toFixed(2)+' USDT</b></div><div><small>ENTRIES</small><b>'+g.entry_count+' / '+g.max_entries+'</b></div>';document.querySelector('#winnerHistory').innerHTML='<div class="ref-row"><span>Ends</span><b>'+new Date(g.ends_at).toLocaleString()+'</b></div><div class="ref-row"><span>Winner</span><b>Drawn after event ends</b></div>';document.querySelector('#giveawayDetail').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){alert(e.message)}}
async function enter(id){if(!gugeeAuth.getCurrentUser()){location.href="login.html";return}try{const r=await gugeeAuth.api("/api/giveaways/"+id+"/enter",{method:"POST"});alert(r.message||"Entry confirmed");load()}catch(e){alert(e.message)}}
load();
</script></body></html>
