<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee — Giveaways</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/community.css"></head>
<body><div class="background-glow"></div><header class="site-header"><a class="brand" href="./"><img class="brand-logo" src="images/gugee-logo-3c.webp" alt="Gugee logo"><span>Gugee</span></a><button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav class="nav" id="siteNav"><a href="markets.html">Markets</a><a href="exchange.html">Market analysis</a><a href="tournaments.html">Tournaments</a><a class="active" href="giveaways.html">Giveaways</a><a href="referrals.html">Referrals</a></nav><a class="login-button" href="account.html">Account</a></header>
<main class="community-page"><section class="hero"><span class="eyebrow">COMMUNITY HISTORY</span><h1>Gugee Giveaways</h1><p>Past events and winner history remain visible. New entries are paused.</p></section><div class="giveaway-grid" id="giveawayGrid"><div class="loading-card">Loading giveaways…</div></div><section class="panel" id="giveawayDetail" hidden><div class="panel-head"><div><span class="eyebrow">GIVEAWAY DASHBOARD</span><h2 id="detailName">Giveaway</h2><p id="detailDescription" class="muted"></p></div></div><div class="event-stats" id="detailStats"></div><div id="winnerHistory" class="table-wrap" style="margin-top:12px"></div></section></main>
<script src="js/auth.js?v=20260927-security4"></script><script>
const esc=v=>String(v??"").replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[c]));
async function load(){try{const r=await gugeeAuth.api("/api/giveaways");const history=r.giveaways.filter(g=>new Date(g.ends_at).getTime()<Date.now()||Number(g.entry_count)>0);document.querySelector("#giveawayGrid").innerHTML=history.map(g=>'<article class="event-card giveaway-card"><div class="event-top"><span class="pill">'+esc(g.status)+'</span><span>'+new Date(g.ends_at).toLocaleString()+'</span></div><h3>'+esc(g.name)+'</h3><p>'+esc(g.description)+'</p><div class="event-stats"><div><small>PRIZE</small><b>$'+Number(g.prize_usdt).toFixed(2)+' USDT</b></div><div><small>ENTRIES</small><b>'+g.entry_count+'</b></div></div><button class="secondary-action detail-btn" data-id="'+g.id+'">View details</button></article>').join("")||'<div class="empty-card">New giveaways are paused. There is no winner history to show yet.</div>';document.querySelectorAll(".detail-btn").forEach(b=>b.onclick=()=>detail(b.dataset.id))}catch(e){document.querySelector("#giveawayGrid").innerHTML='<div class="empty-card">'+esc(e.message)+"</div>"}}
async function detail(id){try{const r=await gugeeAuth.api('/api/giveaways');const g=(r.giveaways||[]).find(x=>String(x.id)===String(id));if(!g)return;document.querySelector('#giveawayDetail').hidden=false;document.querySelector('#detailName').textContent=g.name;document.querySelector('#detailDescription').textContent=g.description||'';document.querySelector('#detailStats').innerHTML='<div><small>STATUS</small><b>'+g.status+'</b></div><div><small>PRIZE</small><b>'+Number(g.prize_usdt).toFixed(2)+' USDT</b></div><div><small>ENTRIES</small><b>'+g.entry_count+' / '+g.max_entries+'</b></div>';document.querySelector('#winnerHistory').innerHTML='<div class="ref-row"><span>Ends</span><b>'+new Date(g.ends_at).toLocaleString()+'</b></div><div class="ref-row"><span>Winner</span><b>Drawn after event ends</b></div>';document.querySelector('#giveawayDetail').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){alert(e.message)}}
async function enter(id){if(!gugeeAuth.getCurrentUser()){location.href="login.html";return}const b=document.querySelector('.enter-btn[data-id="'+CSS.escape(String(id))+'"]'),old=b?.textContent;if(b){b.disabled=true;b.textContent="Entering..."}try{const r=await gugeeAuth.api("/api/giveaways/"+id+"/enter",{method:"POST"});alert(r.message||"Entry confirmed");await load()}catch(e){alert(e.message);if(b){b.disabled=false;b.textContent=old}}}
load();
</script></body></html>
