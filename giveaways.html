<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee — Giveaways</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/community.css"></head>
<body><div class="background-glow"></div><header class="site-header"><a class="brand" href="./"><span class="brand-mark">G</span><span>Gugee</span></a><button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav class="nav" id="siteNav"><a href="markets.html">Markets</a><a href="trading.html">Trading</a><a href="tournaments.html">Tournaments</a><a class="active" href="giveaways.html">Giveaways</a><a href="referrals.html">Referrals</a></nav><a class="login-button" href="account.html">Account</a></header>
<main class="community-page"><section class="hero"><span class="eyebrow">COMMUNITY REWARDS</span><h1>Gugee Giveaways</h1><p>Free community events with transparent rules, entry status and winner history.</p></section><div class="giveaway-grid" id="giveawayGrid"><div class="loading-card">Loading giveaways…</div></div></main>
<script src="js/auth.js"></script><script>
async function load(){try{const r=await gugeeAuth.api("/api/giveaways");document.querySelector("#giveawayGrid").innerHTML=r.giveaways.map(g=>'<article class="event-card giveaway-card"><div class="event-top"><span class="pill">'+g.status+'</span><span>'+new Date(g.ends_at).toLocaleString()+'</span></div><h3>'+g.name+'</h3><p>'+g.description+'</p><div class="event-stats"><div><small>PRIZE</small><b>$'+Number(g.prize_usdt).toFixed(2)+' USDT</b></div><div><small>ENTRIES</small><b>'+g.entry_count+'</b></div></div><button class="primary-btn" data-id="'+g.id+'">'+(g.joined?"Entered":"Enter giveaway")+'</button></article>').join("")||'<div class="empty-card">No active giveaways.</div>';document.querySelectorAll(".event-card button").forEach(b=>b.onclick=()=>enter(b.dataset.id))}catch(e){document.querySelector("#giveawayGrid").innerHTML='<div class="empty-card">'+e.message+"</div>"}}
async function enter(id){if(!gugeeAuth.getCurrentUser()){location.href="login.html";return}try{const r=await gugeeAuth.api("/api/giveaways/"+id+"/enter",{method:"POST"});alert(r.message||"Entry confirmed");load()}catch(e){alert(e.message)}}
load();
</script></body></html>
