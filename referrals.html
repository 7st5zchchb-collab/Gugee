<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee — Referrals</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/community.css"></head>
<body><div class="background-glow"></div><header class="site-header"><a class="brand" href="./"><span class="brand-mark">G</span><span>Gugee</span></a><button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav class="nav" id="siteNav"><a href="markets.html">Markets</a><a href="trading.html">Trading</a><a href="tournaments.html">Tournaments</a><a href="giveaways.html">Giveaways</a><a class="active" href="referrals.html">Referrals</a></nav><a class="login-button" href="account.html">Account</a></header>
<main class="community-page"><section class="hero"><span class="eyebrow">INVITE • GROW • REWARD</span><h1>Referral Program</h1><p>Invite friends with your unique code and track qualified referrals and rewards.</p></section><section class="referral-box"><div><span class="eyebrow">YOUR CODE</span><h2 id="code">—</h2><p id="link">Sign in to generate your referral link.</p></div><button class="primary-btn" id="copy">Copy link</button></section><div class="referral-stats" id="stats"></div><section class="panel"><div class="panel-head"><div><span class="eyebrow">NETWORK</span><h2>My referrals</h2></div></div><div id="refs" class="table-wrap">Loading…</div></section></main>
<script src="js/auth.js"></script><script>
async function load(){if(!gugeeAuth.getCurrentUser()){document.querySelector("#refs").innerHTML='Please <a href="login.html">sign in</a> to use referrals.';return}try{const r=await gugeeAuth.api("/api/referrals");document.querySelector("#code").textContent=r.referral.code;document.querySelector("#link").textContent=r.referral.link;document.querySelector("#copy").onclick=()=>navigator.clipboard.writeText(r.referral.link).then(()=>alert("Referral link copied"));document.querySelector("#stats").innerHTML='<div class="stat-mini"><small>INVITED</small><b>'+r.stats.invited+'</b></div><div class="stat-mini"><small>QUALIFIED</small><b>'+r.stats.qualified+'</b></div><div class="stat-mini"><small>REWARDS</small><b>$'+Number(r.stats.rewards_usdt).toFixed(2)+'</b></div>';document.querySelector("#refs").innerHTML=r.referrals.length?r.referrals.map(x=>'<div class="ref-row"><span>'+x.name+'</span><span>'+x.status+'</span><b>$'+Number(x.reward_usdt||0).toFixed(2)+'</b></div>').join(""):'No referrals yet.'}catch(e){document.querySelector("#refs").textContent=e.message}}
load();
</script></body></html>
