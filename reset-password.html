<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee - Reset Password</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand" href="./"><img class="brand-logo" src="images/gugee-logo-3c.webp" alt="Gugee logo"><span>Gugee</span></a><h1>Reset password</h1><form id="resetForm" class="auth-form"><label>New password<input id="password" type="password" minlength="8" required></label><button class="auth-submit" type="submit">Reset password</button></form><p id="authMessage" class="auth-message"></p><a class="auth-switch" href="login.html">Back to login</a></section></main><script>
document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();const p=new URLSearchParams(location.search);const m=document.getElementById("authMessage");try{const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:p.get("email"),token:p.get("token"),password:document.getElementById("password").value})});const d=await r.json();m.textContent=r.ok?"Password reset successfully.":(d.error||"Reset failed.");if(r.ok)setTimeout(()=>location.href="login.html",1200);}catch{m.textContent="Could not contact Gugee server.";}});</script><footer><span>© 2026 Gugee</span><span>Crypto analytics platform</span><a href="tel:+37410000000">+374 10 000 000</a></footer></body></html>
