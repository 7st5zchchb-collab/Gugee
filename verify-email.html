<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee - Verify Email</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand" href="./"><img class="brand-logo" src="images/gugee-logo-3c.webp" alt="Gugee logo"><span>Gugee</span></a><h1>Verify your email</h1><p id="authMessage" class="auth-message">Checking your verification link...</p><a class="auth-submit" href="login.html">Continue to login</a></section></main><script>
(async()=>{const p=new URLSearchParams(location.search);const token=p.get("token");const email=p.get("email");const m=document.getElementById("authMessage");if(!token||!email){m.textContent="Invalid verification link.";return;}try{const r=await fetch("/api/auth/verify-email?token="+encodeURIComponent(token)+"&email="+encodeURIComponent(email));const d=await r.json();m.textContent=r.ok?"Email verified successfully.":"Verification failed: "+(d.error||"Unknown error.");}catch{m.textContent="Could not contact Gugee server.";}})();
</script><footer><span>© 2026 Gugee</span><span>Crypto analytics platform</span><a href="tel:+37410000000">+374 10 000 000</a></footer><script src="js/auth.js"></script>
</body></html>
