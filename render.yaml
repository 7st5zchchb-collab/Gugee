services:
  - type: web
    name: gugee
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gugee-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://gugee.onrender.com
      - key: EMAIL_FROM
        value: Gugee <noreply@gugee.com>
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: gugee-db
    plan: free
