<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gugee — Account</title>
<link rel="stylesheet" href="css/style.css">
<style>
.account-shell{max-width:1100px;margin:0 auto;padding:80px 20px}
.account-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}
.account-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:28px}
.balance{font-size:42px;font-weight:800;margin:8px 0 28px}
.asset-list{display:grid;gap:12px;margin-top:18px}.asset{display:flex;justify-content:space-between;padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:14px}
.muted{opacity:.65}.error{color:#ff6b6b}
@media(max-width:650px){.account-head{align-items:flex-start;flex-direction:column}.balance{font-size:32px}}
</style>
</head>
<body class="auth-page">
<header class="site-header">
<a class="brand" href="./"><span class="brand-mark">G</span><span>Gugee</span></a>
<nav class="nav"><a href="markets.html">Markets</a><a href="./#analysis">Analysis</a><a href="./#exchanges">Exchanges</a></nav>
<button id="logoutBtn" class="login-button" type="button">Log out</button>
</header>
<main class="account-shell">
<div class="account-head">
<div><p class="section-label">GUGEE ACCOUNT</p><h1 id="welcome">Your Account</h1><p class="muted" id="email"></p></div>
</div>
<section class="account-card">
<p class="section-label">CASH BALANCE</p>
<div class="balance" id="usdt">0.00 USDT</div>
<p class="muted">Your normal wallet balance. Crypto assets are shown separately below.</p>
</section>
<section class="account-card" style="margin-top:20px">
<p class="section-label">BUY CRYPTO</p>
<h2>Buy with USDT</h2>
<form id="buyForm" style="display:grid;gap:12px;max-width:520px;margin-top:16px">
<input id="buyCoin" type="text" placeholder="Coin ID, e.g. bitcoin" required>
<input id="buyAmount" type="number" min="0.01" step="0.01" placeholder="USDT amount" required>
<p id="buyPrice" class="muted">Enter a coin ID to load its live price.</p>
<button class="auth-submit" type="submit">Buy crypto</button>
<p id="buyMessage" class="muted" aria-live="polite"></p>
</form>
</section>
<section class="account-card" style="margin-top:20px">
<p class="section-label">CRYPTO ASSETS</p>
<h2>Your assets</h2>
<div id="assets" class="asset-list"><p class="muted">Loading...</p></div>
</section>
</main>
<script src="js/auth.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
  const user=await window.gugeeAuth.refreshCurrentUser();
  if(!user){window.location.href="login.html";return;}
  document.getElementById("welcome").textContent="Welcome, "+(user.name||"User");
  document.getElementById("email").textContent=user.email;
  document.getElementById("logoutBtn").onclick=window.gugeeAuth.logout;
  const buyForm=document.getElementById("buyForm");
  const buyCoin=document.getElementById("buyCoin");
  const buyAmount=document.getElementById("buyAmount");
  const buyPrice=document.getElementById("buyPrice");
  const buyMessage=document.getElementById("buyMessage");
  let currentPrice=null;
  let priceTimer=null;

  async function loadBuyPrice(){
    const coin=buyCoin.value.trim().toLowerCase();
    if(!coin){currentPrice=null;buyPrice.textContent="Enter a coin ID to load its live price.";return;}
    try{
      const data=await window.gugeeAuth.api("/api/wallet/price?coin="+encodeURIComponent(coin));
      currentPrice=data.price;
      buyPrice.textContent=data.symbol+" live price: $"+Number(data.price).toLocaleString("en-US",{maximumFractionDigits:12});
    }catch(e){
      currentPrice=null;
      buyPrice.textContent=e.message;
    }
  }
  buyCoin.addEventListener("change",loadBuyPrice);
  buyCoin.addEventListener("blur",loadBuyPrice);
  buyForm.addEventListener("submit",async e=>{
    e.preventDefault();
    buyMessage.textContent="";
    if(!currentPrice)await loadBuyPrice();
    if(!currentPrice)return;
    const amount=Number(buyAmount.value);
    if(!Number.isFinite(amount)||amount<=0){buyMessage.textContent="Enter a valid USDT amount.";return;}
    try{
      const result=await window.gugeeAuth.api("/api/wallet/buy",{method:"POST",body:JSON.stringify({coinId:buyCoin.value.trim(),usdtAmount:amount})});
      buyMessage.textContent="Bought "+Number(result.purchase.quantity).toLocaleString(undefined,{maximumFractionDigits:18})+" "+result.purchase.symbol+" for "+Number(result.purchase.usdtAmount).toFixed(2)+" USDT.";
      buyAmount.value="";
      await loadWallet();
    }catch(e){buyMessage.textContent=e.message;}
  });

  async function loadWallet(){
  try{
    const data=await window.gugeeAuth.api("/api/wallet");
    document.getElementById("usdt").textContent=Number(data.wallet.usdt||0).toFixed(2)+" USDT";
    const assets=document.getElementById("assets");
    if(!data.assets.length){assets.innerHTML='<p class="muted">No crypto assets yet.</p>';return;}
    assets.innerHTML=data.assets.map(a=>'<div class="asset"><strong>'+String(a.symbol||a.coin_id).toUpperCase()+'</strong><span>'+Number(a.quantity).toLocaleString(undefined,{maximumFractionDigits:18})+'</span></div>').join("");
  }catch(e){
    document.getElementById("assets").innerHTML='<p class="error">Could not load wallet.</p>';
  }
  }
  await loadWallet();
});
</script>
</body>
</html>
