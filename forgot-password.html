<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gugee - Forgot Password</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand">GUGEE</div><h1>Forgot password</h1><form id="forgotForm" class="auth-form"><label>Email<input id="email" type="email" required></label><button class="auth-submit" type="submit">Send reset link</button></form><p id="authMessage" class="auth-message"></p><a class="auth-switch" href="login.html">Back to login</a></section></main><script>
document.getElementById("forgotForm").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("authMessage");try{const r=await fetch("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value})});const d=await r.json();m.textContent=d.message||d.error||"Request complete.";}catch{m.textContent="Could not contact Gugee server.";}});</script><footer><span>© 2026 Gugee</span><span>Crypto analytics platform</span><a href="tel:+37410000000">+374 10 000 000</a></footer></body></html>
